name: movies_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  dotted_border: ^2.1.0
  image_picker: ^1.2.1
  http: ^1.2.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cached_network_image: ^4.0.0
  cloud_firestore: ^6.9.0
  dio: ^5.11.1
  equatable: ^2.1.0
  firebase_auth: ^6.6.1
  firebase_core: ^4.14.0
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  get_it: ^9.2.1
  go_router: ^18.0.0
  intl: any
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter_native_splash:
  color: "#121312"
  image: assets/images/app_logo.png
  branding: assets/images/splash_branding.png
  branding_mode: bottom
  branding_bottom_padding: 24
  android: true
  ios: true
  web: false
  fullscreen: true

  android_12:
    color: "#121312"
    image: assets/images/app_logo.png
    branding: assets/images/splash_branding.png

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
